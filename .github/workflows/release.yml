name: Release Windows installer

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: client/package-lock.json

      - name: Build installer
        shell: pwsh
        run: ./scripts/build-release.ps1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Locate installer
        id: find-installer
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path client/build -Filter 'DocSortR-Setup-*.exe' | Select-Object -First 1
          if (-not $exe) { throw "Installer not found in client/build" }
          "path=$($exe.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "name=$($exe.Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.find-installer.outputs.name }}
          path: ${{ steps.find-installer.outputs.path }}
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.find-installer.outputs.path }}
          generate_release_notes: true
          fail_on_unmatched_files: true
